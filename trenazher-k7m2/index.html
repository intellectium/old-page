<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр к олимпиаде — Интеллектиум</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="yandex" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#343F9E;--blue-d:#262E78;--ink:#1E2440;--muted:#4A5172;--bg:#F3F5FC;--card:#FFFFFF;--yellow:#FFC83D;--cream:#FFF4D6;--lav:#E8EBFA;--line:#D5DAF0;--line2:#C9CFEA;--goldtext:#7A5A00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;color:inherit}
.screen{max-width:480px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;flex-direction:column;gap:6px}.logo{width:210px;height:auto}.descr{font-size:14px;font-weight:800;color:var(--blue)}
.hero{background:var(--blue);color:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px}
.hero h1{margin:0;font-size:30px;line-height:1.15;font-weight:900}.hero p{margin:0;font-weight:600;color:#E3E7FF}.hero .olymp{font-weight:800;color:#fff}
.chip{align-self:flex-start;background:var(--yellow);color:var(--ink);font-weight:900;font-size:14px;padding:6px 12px;border-radius:999px}
.card{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 0 rgba(30,36,64,.06)}
.card.row{flex-direction:row;align-items:center;gap:14px}
h2{margin:0;font-size:19px;font-weight:900}.h1dark{margin:0;font-size:25px;line-height:1.2;font-weight:900}.h2dark{margin:0;font-size:20px;font-weight:900}
.muted{color:var(--muted)}.small{font-size:14px}.b{font-weight:900}.grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.kicker{font-size:13px;font-weight:900;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.label{font-size:14px;font-weight:900;color:var(--blue-d);text-transform:uppercase;letter-spacing:.04em}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.klass{min-height:64px;border-radius:16px;border:3px solid var(--line2);background:#fff;color:var(--blue-d);font-size:26px;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.klass small{font-size:12px;font-weight:800;margin-top:4px}.klass.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chipbtn{min-height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--blue-d);font-weight:800;font-size:12px;overflow-wrap:anywhere;line-height:1.15;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px}
.chipbtn.on{border:3px solid var(--blue);background:var(--lav);color:var(--ink)}
.dot{display:inline-block;border-radius:50%;border:2px solid rgba(30,36,64,.25);flex-shrink:0}
.btn{min-height:56px;border-radius:16px;border:none;font-size:19px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;text-decoration:none;width:100%}
.btn.primary{background:var(--yellow);color:var(--ink)}.btn.primary:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;border:2px solid var(--blue);color:var(--blue);min-height:50px;font-size:17px}
.link{background:none;border:none;color:var(--blue);font-weight:800;font-size:16px;cursor:pointer;min-height:44px;padding:0;display:flex;align-items:center;gap:4px}
.link.center{align-self:center;text-decoration:underline;text-underline-offset:4px}
.note{font-size:15px;color:var(--blue-d);font-weight:700}.note:empty{display:none}
.tip{display:flex;gap:12px;align-items:flex-start;font-weight:700;color:var(--blue-d)}.tip.small{font-size:15px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.big{width:72px;height:72px}.ic.gold{color:var(--yellow)}.win .ic.big{fill:var(--yellow);color:var(--yellow)}
.namebox{background:var(--cream);border:3px dashed var(--yellow);border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bigname{font-size:30px;line-height:1.1;font-weight:900}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--muted)}.who.big .nm{font-size:18px;font-weight:900;color:var(--ink);line-height:1.1}
.bars{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}.bar{height:10px;border-radius:5px;background:#DDE1F2}.bar.done{background:var(--blue)}.bar.tried{background:var(--yellow)}
.olympbtn{display:flex;align-items:center;gap:14px;background:var(--blue);color:#fff;border:none;border-radius:20px;padding:18px;text-align:left;cursor:pointer}
.olympbtn b{font-size:19px;font-weight:900}.olympbtn span span{color:#E3E7FF;font-size:14px;font-weight:700}.olympbtn .ic{width:36px;height:36px}
.row-between{display:flex;justify-content:space-between;align-items:baseline}
.list{display:flex;flex-direction:column;gap:10px}
.typecard,.review summary{display:flex;align-items:center;gap:12px;background:#fff;border:none;border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;box-shadow:0 2px 0 rgba(30,36,64,.06);min-height:60px;width:100%}
.typecard b,.review b{font-size:16px;font-weight:900;line-height:1.2}
.num{width:28px;text-align:center;font-size:18px;font-weight:900;color:var(--blue);flex-shrink:0}
.status{display:flex;flex-direction:column;align-items:center;gap:2px;width:72px;flex-shrink:0;text-align:center;line-height:1.1;color:var(--muted);font-weight:800}
.mark{width:24px;height:24px;border-radius:50%;border:3px solid var(--line2);background:#fff}
.mark.done{background:var(--blue);border-color:var(--blue);box-shadow:inset 0 0 0 4px #fff}
.mark.tried{border-color:#D4A72C;background:linear-gradient(90deg,var(--yellow) 50%,#fff 50%)}
.streak{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:800;color:var(--blue-d)}
.dots{display:flex;gap:6px}.dots .d{width:16px;height:16px;border-radius:50%;border:3px solid var(--line2);background:#fff}.dots .d.on{background:var(--blue);border-color:var(--blue)}
.dots.big .d{width:22px;height:22px}
.task .tasktext{margin:0;font-size:19px;line-height:1.5;font-weight:600}
.answer{display:flex;flex-direction:column;gap:8px}.answer label{font-size:16px;color:var(--ink);text-transform:none;letter-spacing:0}
.ansrow{display:flex;align-items:center;gap:10px}
.frame{font-family:inherit;width:150px;font-size:30px;font-weight:900;text-align:center;color:var(--ink);padding:8px;border:3px solid var(--ink);border-radius:6px;background:#fff}
.frame.small{width:110px;font-size:26px}.frame:focus{outline:3px solid var(--yellow);outline-offset:2px}
.unit{font-size:18px;font-weight:800;color:var(--muted)}
.multi{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.plus{background:none;border:2px dashed var(--blue);color:var(--blue);border-radius:12px;min-height:48px;padding:0 14px;font-weight:800;cursor:pointer}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.choices.two{grid-template-columns:1fr 1fr}
.choice{min-height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:16px;overflow-wrap:anywhere;line-height:1.2;font-weight:800;color:var(--blue-d);cursor:pointer;padding:6px}
.choice.on{border:3px solid var(--blue);background:var(--lav);color:var(--ink)}
.feedback:empty{display:none}.feedback.soft{background:var(--lav);border-radius:18px;padding:14px 16px;color:var(--blue-d);font-weight:700}
.fbrow{display:flex;gap:12px;align-items:flex-start}.fbrow b{display:block;font-size:18px;font-weight:900;margin-bottom:2px}.fbrow .ic{width:32px;height:32px}
.hints{display:flex;flex-direction:column;gap:10px}.hints:empty{display:none}
.hint{background:var(--cream);border-radius:16px;padding:14px 16px;font-size:17px;font-weight:700;display:flex;flex-direction:column;gap:4px}
.hint.full{background:#fff;border:2px solid var(--blue)}
.hlabel{font-size:13px;font-weight:900;color:var(--goldtext);text-transform:uppercase;letter-spacing:.04em}.hint.full .hlabel{color:var(--blue)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.win{background:var(--blue);color:#fff;border-radius:24px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.win h1{margin:0;font-size:32px;font-weight:900}.win p{margin:0;font-size:18px;color:#E3E7FF;font-weight:700}.win b{color:#fff}
.trick{background:var(--cream);border-radius:18px;padding:16px;font-size:17px;font-weight:700;display:flex;flex-direction:column;gap:4px}
.review{background:none}.review summary{list-style:none}.review summary::-webkit-details-marker{display:none}
.pic{display:flex;justify-content:center;margin-top:4px}.pic svg{width:100%;max-width:340px;height:auto;max-height:300px}
.review[open] summary{border-radius:16px 16px 0 0}.review > .hint, .review > .btn{margin-top:8px}
@media (min-width:700px){.screen{padding-top:32px}}
</style>
</head>

      h('section', { class: 'card task' }, h('div', { class: 'muted small b', text: 'Задача ' + c.taskNo }), h('p', { class: 'tasktext', text: c.task.text }), pic(c.task)),

  function answerShow(task) { var a = task.answer; if (a.kind === 'multi') return a.value.join(' или '); if (a.kind === 'yesno') return a.value === 'да' ? 'да' : 'нет'; return String(a.value) + (a.unit ? ' ' + a.unit : ''); }

  // =================== ПРОБНАЯ ОЛИМПИАДА ===================
  var trial = null;
  function startTrial() {

      h('div', { class: 'bars', 'aria-hidden': 'true' }, trial.items.map(function (x, j) { return h('span', { class: 'bar ' + (j < trial.i ? 'done' : j === trial.i ? 'tried' : 'new') }); })),
      h('section', { class: 'card task' }, h('p', { class: 'tasktext', text: it.task.text }), pic(it.task)),
      h('div', { class: 'answer' }, h('div', { class: 'label', id: 'anslabel' }, h('label', { for: 'ans', text: 'Ответ' })), inp.el),

        h('button', { type: 'button', class: 'btn ghost', onclick: function () { go(true); } }, 'Пропустить'))));

  function screenTrialEnd() {

      h('h2', { class: 'h2dark', text: 'Как прошло' }),
      h('div', { class: 'list' }, trial.items.map(function (x) {

            h('span', { class: 'status' }, h('span', { class: 'mark ' + st, 'aria-hidden': 'true' }), h('span', { class: 'small', text: lab }))),
          h('div', { class: 'hint full' }, h('div', { class: 'hlabel', text: 'Разбор' }), h('div', { class: 'small', text: x.task.text }), pic(x.task), h('div', { text: x.task.hints[2] })),
          h('button', { type: 'button', class: 'btn ghost', onclick: function () { startTraining(x.T.id); } }, 'Тренировать этот вид'));
        return det;
      })),
      h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn primary', onclick: screenHome }, 'К карте задач'))));
  }

  // ---------- старт ----------
  if (CFG.METRIKA_ID) {

    try { window.ym(CFG.METRIKA_ID, 'init', { clickmap: true, trackLinks: true, accurateTrackBounce: true }); } catch (e) { }
